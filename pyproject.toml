[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-lander-reward-shaping"
version = "0.1.0"
description = "Lunar Lander Reward-Shaping & Live Physics Simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium[box2d]>=1.0.0",
    "stable-baselines3>=2.3.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "imageio>=2.30.0",
    "imageio-ffmpeg>=0.4.8",
    "pillow>=10.0.0",
    "pygame-ce>=2.4.0",
    "tensorboard>=2.14.0",
    "tqdm>=4.65.0",
    "pytest>=7.4.0",
    "hypothesis>=6.80.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
]

[tool.setuptools.packages.find]
where = ["src"]

